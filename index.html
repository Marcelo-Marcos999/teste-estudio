<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jogo da Velha para dois jogadores com persistência local" />
    <meta name="theme-color" content="#05060a" />
    <title>Jogo da Velha</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192x192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jogo da Velha" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #05060a;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tic-tac-toe-theme');
          var theme = stored;
          try {
            var parsed = JSON.parse(stored);
            if (typeof parsed === 'string') theme = parsed;
          } catch (e) {
            /* valor não é JSON, usa como está */
          }
          // "light" = Neon Grid (padrão), "dark" = Synthwave
          if (theme !== 'light' && theme !== 'dark') {
            theme = 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* localStorage indisponível */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
